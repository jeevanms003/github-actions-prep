name: React CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build-and-test:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run tests
      - name: Run tests
        run: npm test -- --run

      # 5. Build React application
      - name: Build application
        run: npm run build

      # 6. Save build files
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/


  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: dist

      - name: Deploy
        run: |
          echo "Deploying React application..."
          # Deployment command goes here
